name: DNSpire
options:
  bundleIdPrefix: com.dnspire
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # XcodeGen defaults to xcode16_0 (pbxproj objectVersion 77), which Xcode
  # 15.4 (the CI toolchain) refuses to open with "future Xcode project file
  # format (77)". Pin to xcode15_0 so the generated project is readable by
  # Xcode 15.x. Newer Xcode versions still open it fine.
  projectFormat: xcode15_0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # Allow unsigned local builds for sideloading. CI can override to "iPhone Developer".
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SUPPORTS_MACCATALYST: NO
    # Make the embedded xcframework discoverable.
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/Frameworks"

targets:
  DNSpire:
    type: application
    platform: iOS
    sources:
      - path: DNSpire
    info:
      path: DNSpire/Info.plist
      properties:
        CFBundleDisplayName: DNSpire
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Permit WKWebView traffic to flow through the local SOCKS5 endpoint.
        # End sites are still subject to their own TLS requirements.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnspire.ios
        CODE_SIGN_ENTITLEMENTS: DNSpire/DNSpire.entitlements
    dependencies:
      - framework: Frameworks/DNSpireCore.xcframework
        embed: true
        codeSign: true
      - target: DNSpirePacketTunnel

  DNSpirePacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: DNSpirePacketTunnel
    info:
      path: DNSpirePacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: DNSpire Packet Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnspire.ios.tunnel
        # Avoid colliding with the gomobile-generated Swift type
        # `DNSpirePacketTunnel` (prefix `DNSpire` + Go struct `PacketTunnel`).
        # If the module is also named DNSpirePacketTunnel, Swift resolves the
        # bare identifier to the module instead of the framework type.
        PRODUCT_MODULE_NAME: DNSpireTunnelExt
        CODE_SIGN_ENTITLEMENTS: DNSpirePacketTunnel/DNSpirePacketTunnel.entitlements
    dependencies:
      - framework: Frameworks/DNSpireCore.xcframework
        embed: false
        codeSign: true
